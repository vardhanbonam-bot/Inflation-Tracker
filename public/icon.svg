<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#061c24" />
    </linearGradient>
    <linearGradient id="mirrorBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="auraGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <!-- Ambient background glow aura -->
  <circle cx="256" cy="256" r="210" fill="#2dd4bf" opacity="0.18" filter="url(#auraGlow)" />
  <circle cx="256" cy="256" r="170" fill="#38bdf8" opacity="0.12" filter="url(#auraGlow)" />

  <!-- Outer Rounded Squircle Glass Bezel -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#mirrorBorderGrad)" stroke-width="6" />

  <!-- Inner Mirror Screen Bevel -->
  <rect x="42" y="42" width="428" height="428" rx="90" fill="#030712" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Background Financial Graph Grid -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <line x1="80" y1="352" x2="432" y2="352" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <line x1="160" y1="80" x2="160" y2="432" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <line x1="352" y1="80" x2="352" y2="432" stroke="rgba(255,255,255,0.05)" stroke-width="2" />

  <!-- 1. Reference Macro Inflation Curve (Dashed Baseline) -->
  <path d="M 90 370 Q 220 340 420 280" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.8" />

  <!-- 2. Personal Student Inflation Laser Curve -->
  <path d="M 90 350 Q 210 300 410 140" fill="none" stroke="url(#trendGrad)" stroke-width="20" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- 3. Peak Reflection Node (Pulsing Apex) -->
  <circle cx="410" cy="140" r="32" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.5" />
  <circle cx="410" cy="140" r="18" fill="#2dd4bf" filter="url(#neonGlow)" />
  <circle cx="410" cy="140" r="8" fill="#ffffff" />

  <!-- 4. Diagonal Specular Glass Light Sheen -->
  <rect x="42" y="42" width="428" height="428" rx="90" fill="url(#sheenGrad)" />

  <!-- 5. Top-Right Prismatic Diamond Star Sparkle -->
  <g transform="translate(380, 70)">
    <polygon points="24,0 30,18 48,24 30,30 24,48 18,30 0,24 18,18" fill="#ffffff" filter="url(#neonGlow)" />
    <circle cx="24" cy="24" r="4" fill="#38bdf8" />
  </g>
</svg>
